name: Interactive Android (browser control)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Длительность сессии (минут, макс 350)"
        default: "60"
      action:
        description: "run = интерактивная сессия; snapshot = сохранить состояние AVD в Release"
        default: "run"
        type: choice
        options:
          - run
          - snapshot
      url:
        description: "Ссылка (например, отзыв в Я.Картах). Гео будет выставлено по ll= из ссылки, ссылка откроется на эмуляторе"
        default: ""
      review_text:
        description: "Текст отзыва (кириллица ок) — вводится в открытую форму через ADBKeyboard"
        default: ""
      script:
        description: "Имя скрипта из scripts/ — выполняется после установки приложений (диагностика)"
        default: ""
      fresh:
        description: "yes = поднять AVD с нуля, НЕ восстанавливать сейв из Release"
        default: ""

jobs:
  interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SDK: /usr/local/lib/android/sdk
      ADB: /usr/local/lib/android/sdk/platform-tools/adb
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo adduser $USER kvm

      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-31
          key: sysimg-android-31-google_apis-x86_64-v1

      - name: Install system image + emulator
        run: |
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "emulator" "platform-tools" "system-images;android-31;google_apis;x86_64" > /dev/null

      - name: Free disk space
        run: |
          # освобождаем место: чужие предустановленные образы не нужны, ставим свой android-31
          for D in /usr/local/lib/android/sdk/system-images/android-*; do
            [ "$D" = "/usr/local/lib/android/sdk/system-images/android-31" ] || sudo rm -rf "$D" || true
          done
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Restore AVD snapshot from Release
        if: github.event.inputs.fresh != 'yes'
        run: |
          # сейв: основной Release avd-snap, резервный avd-backup; наборы s<ts>_part_* (с проверкой) или legacy part_*
          rm -rf /tmp/avdparts && mkdir -p /tmp/avdparts
          for TAG in avd-snap avd-backup; do
            gh release view $TAG -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || continue
            echo "пробую сейв из $TAG"
            rm -rf /tmp/avdparts && mkdir -p /tmp/avdparts
            # выбираем самый свежий полный набор s<ts>_part_*
            NEWEST=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG --jq '.assets[].name' 2>/dev/null | grep -oE '^s[0-9]+_part_00$' | sed 's/_part_00$//' | sort | tail -1)
            if [ -n "$NEWEST" ]; then
              gh release download $TAG -R "$GITHUB_REPOSITORY" --pattern "${NEWEST}_part_*" --dir /tmp/avdparts >/dev/null 2>&1 || true
            else
              gh release download $TAG -R "$GITHUB_REPOSITORY" --pattern 'part_*' --dir /tmp/avdparts >/dev/null 2>&1 || true
            fi
            if ls /tmp/avdparts/*part_* >/dev/null 2>&1; then
              cat /tmp/avdparts/*part_* > /tmp/avd.tar.gz
              echo "restoring from $TAG parts: $(ls /tmp/avdparts | wc -l) chunk(s), $(stat -c%s /tmp/avd.tar.gz) bytes"
            else
              gh release download $TAG -R "$GITHUB_REPOSITORY" --pattern 'avd-live.tar.gz' --dir /tmp >/dev/null 2>&1 || true
              [ -f /tmp/avd-live.tar.gz ] && mv /tmp/avd-live.tar.gz /tmp/avd.tar.gz
              echo "restoring from $TAG legacy single asset"
            fi
            if [ -s /tmp/avd.tar.gz ] && gzip -t /tmp/avd.tar.gz 2>/dev/null; then
              mkdir -p "$ANDROID_AVD_HOME"
              rm -rf "$ANDROID_AVD_HOME/pixel6a.avd" "$ANDROID_AVD_HOME/pixel6a.ini" "$ANDROID_AVD_HOME/avd"
              # новый формат: pixel6a.ini + pixel6a.avd; legacy: каталог avd/
              if tar tzf /tmp/avd.tar.gz | grep -q "^pixel6a"; then
                tar xzf /tmp/avd.tar.gz -C "$ANDROID_AVD_HOME"
                echo "restored snapshot AVD from $TAG (pixel6a layout)"
              else
                tar xzf /tmp/avd.tar.gz -C "$ANDROID_AVD_HOME/.."
                echo "restored snapshot AVD from $TAG (legacy layout)"
              fi
              rm -rf "$ANDROID_AVD_HOME/pixel6a.avd/snapshots" "$ANDROID_AVD_HOME/pixel6a.avd/hardware-qemu.ini" "$ANDROID_AVD_HOME/pixel6a.avd"/*.lock "$ANDROID_AVD_HOME/pixel6a.avd/cache.img"* 2>/dev/null
              # pixel6a.ini перезаписываем под текущий раннер (path зашит с чужого)
              cat > "$ANDROID_AVD_HOME/pixel6a.ini" <<EOF
              avd.ini.encoding=UTF-8
              path=$ANDROID_AVD_HOME/pixel6a.avd
              path.rel=avd/pixel6a.avd
              target=android-31
              EOF
              CFG="$ANDROID_AVD_HOME/pixel6a.avd/config.ini"
              [ -f "$CFG" ] && sed -i 's/^hw.lcd.width=.*/hw.lcd.width=720/; s/^hw.lcd.height=.*/hw.lcd.height=1560/; s/^hw.lcd.density=.*/hw.lcd.density=280/; s/^hw.cpu.ncore=.*/hw.cpu.ncore=2/' "$CFG"
              ls "$ANDROID_AVD_HOME"
              echo "restored=yes" >> $GITHUB_ENV
              rm -f /tmp/avd.tar.gz
              break
            else
              rm -rf "$ANDROID_AVD_HOME/pixel6a.avd" "$ANDROID_AVD_HOME/pixel6a.ini"
            fi
            echo "WARN: в $TAG нет валидного сейва"
            rm -f /tmp/avd.tar.gz
          done
          if [ ! -f "$ANDROID_AVD_HOME/pixel6a.avd/config.ini" ]; then
            echo "WARN: сейва нет ни в одном Release — создаю AVD с нуля"
          fi

      - name: Create AVD (Pixel 6a, 1080x2400@420)
        if: env.restored != 'yes'
        run: |
          rm -rf "$ANDROID_AVD_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | $SDK/cmdline-tools/latest/bin/avdmanager create avd -n pixel6a -k "system-images;android-31;google_apis;x86_64" -d pixel_6a --force
          CFG="$ANDROID_AVD_HOME/pixel6a.avd/config.ini"
          cat >> "$CFG" <<EOF
          hw.lcd.width=720
          hw.lcd.height=1560
          hw.lcd.density=280
          hw.ramSize=4096
          hw.cpu.ncore=2
          disk.dataPartition.size=8G
          EOF

      - name: Boot emulator
        if: github.event.inputs.action == 'run'
        run: |
          sudo sysctl vm.overcommit_memory=1 || true
          nohup $SDK/emulator/emulator -avd pixel6a \
            -no-window -no-boot-anim -no-metrics -no-audio \
            -gpu swiftshader_indirect -accel on -writable-system -no-snapshot \
            -feature -Vulkan \
            -memory 2048 -cores 2 \
            -camera-back emulated -camera-front emulated \
            > "${{ github.workspace }}/emulator.log" 2>&1 &
          for i in $(seq 1 90); do
            sleep 5
            BOOT=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "BOOT OK at $((i*5))s"; break; fi
          done
          echo '=== emulator.log (tail) ==='; tail -60 "${{ github.workspace }}/emulator.log" || true
          $ADB shell getprop sys.boot_completed
          $ADB wait-for-device
          sleep 5
          $ADB shell input keyevent 82 || true
          $ADB shell wm dismiss-keyguard || true
          # отключаем анимации — меньше нагрузки на рендер и стрим
          $ADB shell settings put global window_animation_scale 0.0 || true
          $ADB shell settings put global transition_animation_scale 0.0 || true
          $ADB shell settings put global animator_duration_scale 0.0 || true

      - name: Spoof device props (Pixel 6a, Moscow)
        if: github.event.inputs.action == 'run'
        run: |
          # build.prop правим ТОЛЬКО на свежем AVD (restored != 'yes') — иначе меняем fingerprint и Яндекс сбрасывает сессию
          if [ "${{ env.restored }}" != "yes" ]; then
            $ADB root || true; sleep 3
            for f in /system/build.prop /vendor/build.prop; do
              $ADB shell "su 0 sed -i 's/^ro.product.model=.*/ro.product.model=Pixel 6a/; s/^ro.product.brand=.*/ro.product.brand=google/; s/^ro.product.device=.*/ro.product.device=bluejay/; s/^ro.product.name=.*/ro.product.name=bluejay/' $f" 2>/dev/null || true
            done
          else
            echo "restored=yes — build.prop не трогаем (сохраняем fingerprint)"
          fi
          $ADB shell "su 0 setprop persist.sys.timezone Europe/Moscow" || true
          $ADB shell "settings put system time_zone Europe/Moscow" || true
          $ADB shell "setprop persist.sys.locale ru-RU" 2>/dev/null || true
          # гео: если задан url — берём ll=долгота,широта из ссылки, иначе Москва
          URL_IN="${{ github.event.inputs.url }}"
          GLON=37.6173; GLAT=55.7558
          if [ -n "$URL_IN" ]; then
            LL=$(echo "$URL_IN" | grep -oE 'll=[0-9.]+(%2C|,)[0-9.]+' | head -1 | sed 's/^ll=//; s/%2C/,/')
            if [ -n "$LL" ]; then
              GLON=${LL%,*}; GLAT=${LL#*,}
              echo "geo from URL: lat=$GLAT lon=$GLON"
            else
              echo "WARN: ll= не найден в url, оставляю Москву"
            fi
          fi
          $ADB emu geo fix $GLON $GLAT || true
          sleep 2

      - name: ARM translation + Install Yandex Maps + Yandex app
        if: github.event.inputs.action == 'run' && env.restored != 'yes'
        run: |
          set -e
          echo "=== Пересадка libndk_translation (ARM->x86_64), фаза A: disable-verity ==="
          $ADB root || true; sleep 3
          $ADB disable-verity || true
          echo "=== хост-рестарт эмулятора ==="
          $ADB shell sync || true
          $ADB shell reboot -p || true
          for i in $(seq 1 30); do $ADB get-state >/dev/null 2>&1 || break; sleep 1; done
          sleep 10
          $ADB emu kill >/dev/null 2>&1 || true
          sleep 20
          cd "$ANDROID_AVD_HOME/.."
          rm -rf "$ANDROID_AVD_HOME/pixel6a.avd/snapshots" "$ANDROID_AVD_HOME/pixel6a.avd/hardware-qemu.ini"
          nohup $SDK/emulator/emulator -avd pixel6a \
            -no-window -no-boot-anim -no-metrics -no-audio \
            -gpu swiftshader_indirect -accel on -writable-system -no-snapshot \
            -feature -Vulkan \
            -memory 2048 -cores 2 \
            -camera-back emulated -camera-front emulated \
            > "${{ github.workspace }}/emulator.log" 2>&1 &
          cd -
          BOOTOK=0
          for i in $(seq 1 60); do sleep 5; B=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$B" = "1" ] && { echo "RESTART OK $((i*5))s"; BOOTOK=1; break; }; done
          [ "$BOOTOK" = "1" ] || { echo "эмулятор не поднялся"; tail -60 "$GITHUB_WORKSPACE/emulator.log" || true; exit 1; }
          sleep 8; $ADB root || true; sleep 3
          $ADB remount; sleep 2
          # тарбол транслятора из релиза maps-apk: один push вместо 96
          gh release download maps-apk -R "$GITHUB_REPOSITORY" --dir /tmp/nbdl --pattern 'libndk_translation-12.0.0.tar'
          mkdir -p /tmp/nb && tar -xf /tmp/nbdl/libndk_translation-12.0.0.tar -C /tmp/nb
          cd /tmp/nb && tar cf /tmp/ndk.tar system && cd - >/dev/null
          $ADB push /tmp/ndk.tar /data/local/tmp/ndk.tar
          $ADB shell "tar -xf /data/local/tmp/ndk.tar -C / && rm /data/local/tmp/ndk.tar"
          $ADB shell chmod 755 /system/bin/arm64/* /system/bin/ndk_translation_program_runner_binfmt_misc_arm64 2>/dev/null || true
          # abilist: все три источника (odm/vendor/system) -> x86_64,arm64-v8a
          for PF in /system/build.prop /vendor/build.prop /odm/etc/build.prop; do
            $ADB pull $PF /tmp/bpx >/dev/null 2>&1 || { echo "нет $PF"; continue; }
            sed -i \
              -e "s|^ro.odm.product.cpu.abilist=.*|ro.odm.product.cpu.abilist=x86_64,arm64-v8a|" \
              -e "s|^ro.vendor.product.cpu.abilist=.*|ro.vendor.product.cpu.abilist=x86_64,arm64-v8a|" \
              -e "s|^ro.system.product.cpu.abilist=.*|ro.system.product.cpu.abilist=x86_64,arm64-v8a|" \
              -e "s|^ro.odm.product.cpu.abilist64=.*|ro.odm.product.cpu.abilist64=x86_64,arm64-v8a|" \
              -e "s|^ro.vendor.product.cpu.abilist64=.*|ro.vendor.product.cpu.abilist64=x86_64,arm64-v8a|" \
              -e "s|^ro.system.product.cpu.abilist64=.*|ro.system.product.cpu.abilist64=x86_64,arm64-v8a|" \
              /tmp/bpx
            # native.bridge могло не быть в образе — добавляем принудительно
            grep -q '^ro.dalvik.vm.native.bridge=' /tmp/bpx && sed -i "s|^ro.dalvik.vm.native.bridge=.*|ro.dalvik.vm.native.bridge=libnb.so|" /tmp/bpx || echo "ro.dalvik.vm.native.bridge=libnb.so" >> /tmp/bpx
            $ADB push /tmp/bpx $PF >/dev/null
            $ADB shell chmod 644 $PF
          done
          echo "=== фаза B: хост-рестарт после правки /system ==="
          $ADB shell sync || true
          $ADB shell reboot -p || true
          for i in $(seq 1 30); do $ADB get-state >/dev/null 2>&1 || break; sleep 1; done
          sleep 10
          $ADB emu kill >/dev/null 2>&1 || true
          sleep 20
          cd "$ANDROID_AVD_HOME/.."
          rm -rf "$ANDROID_AVD_HOME/pixel6a.avd/snapshots" "$ANDROID_AVD_HOME/pixel6a.avd/hardware-qemu.ini"
          nohup $SDK/emulator/emulator -avd pixel6a \
            -no-window -no-boot-anim -no-metrics -no-audio \
            -gpu swiftshader_indirect -accel on -writable-system -no-snapshot \
            -feature -Vulkan \
            -memory 2048 -cores 2 \
            -camera-back emulated -camera-front emulated \
            > "${{ github.workspace }}/emulator.log" 2>&1 &
          cd -
          BOOTOK=0
          for i in $(seq 1 60); do sleep 5; B=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$B" = "1" ] && { echo "RESTART2 OK $((i*5))s"; BOOTOK=1; break; }; done
          [ "$BOOTOK" = "1" ] || { echo "эмулятор не поднялся"; tail -60 "$GITHUB_WORKSPACE/emulator.log" || true; exit 1; }
          sleep 10
          echo "== abilist: $($ADB shell getprop ro.product.cpu.abilist)"
          echo "== bridge: $($ADB shell getprop ro.dalvik.vm.native.bridge)"
          $ADB shell input keyevent 82 || true
          $ADB shell wm dismiss-keyguard || true
          $ADB shell settings put global window_animation_scale 0.0 || true
          $ADB shell settings put global transition_animation_scale 0.0 || true
          $ADB shell settings put global animator_duration_scale 0.0 || true

          echo "=== Установка Карт ==="
          mkdir -p /tmp/apks && cd /tmp/apks
          gh release download maps-apk -R "$GITHUB_REPOSITORY" --dir /tmp/apks --pattern 'maps3021.apk'
          unzip -t maps3021.apk >/dev/null && echo "apk OK" || echo "apk BROKEN"
          $ADB install -r -g maps3021.apk || echo "MAPS INSTALL FAILED (нефатально)"
          # Yandex app (3 сплита)
          mkdir -p /tmp/ya && cd /tmp/ya
          for A in yandex_base.apk config.ru.apk config.xhdpi.apk; do
            U=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/yandex-app -q ".assets[] | select(.name==\"$A\") | .url")
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" "$U" -o "$A"
          done
          $ADB install-multiple -r yandex_base.apk config.ru.apk config.xhdpi.apk || echo "yandex install failed"
          cd - >/dev/null
          # маркер персистентности для диагностики рестора
          $ADB shell "date > /data/local/tmp/persist_ok" || true

      - name: Open target URL
        if: github.event.inputs.url != ''
        run: |
          # ждём полного подъёма системы, затем открываем ссылку (например, форму отзыва)
          sleep 10
          $ADB shell am start -a android.intent.action.VIEW -d "${{ github.event.inputs.url }}" || echo "am start failed"

      - name: Type review text (ADBKeyboard, кириллица)
        if: github.event.inputs.review_text != ''
        run: |
          # пауза ~3.5 мин: полная прогрузка карты и формы отзыва
          sleep 210
          # ставим ADBKeyboard (input text не умеет кириллицу)
          curl -sL -o /tmp/adbkey.apk https://github.com/senzhk/ADBKeyBoard/raw/master/ADBKeyboard.apk
          $ADB install -r -g /tmp/adbkey.apk || echo "adbkey install failed"
          sleep 8
          echo "IME list: $($ADB shell ime list -s | tr -d '\r' | tr '\n' ' ')"
          $ADB shell ime enable com.android.adbkeyboard/.AdbIME || true
          if ! $ADB shell ime list -s | grep -q AdbIME; then
            echo "ime enable не сработал — fallback через settings put"
            $ADB shell settings put secure enabled_input_methods com.android.adbkeyboard/.AdbIME || true
          fi
          # тап по полю (720x1560) — клавиатура открывается на сфокусированном поле
          $ADB shell input tap 360 680
          sleep 3
          # переключаем IME при активном поле
          $ADB shell ime set com.android.adbkeyboard/.AdbIME || $ADB shell settings put secure default_input_method com.android.adbkeyboard/.AdbIME
          sleep 2
          echo "IME now: $($ADB shell settings get secure default_input_method) IMEs: $($ADB shell ime list -s | tr -d '\r' | tr '\n' ' ')"
          B64=$(printf '%s' "${{ github.event.inputs.review_text }}" | base64 -w0)
          FRAG=$(printf '%s' "${{ github.event.inputs.review_text }}" | cut -c1-12)
          # до 3 попыток: broadcast -> проверка uiautomator
          for TRY in 1 2 3; do
            echo "=== attempt $TRY ==="
            $ADB shell am broadcast -a ADB_INPUT_B64 --es msg "$B64"
            sleep 5
            $ADB shell uiautomator dump /sdcard/ui$TRY.xml > /dev/null 2>&1 || true
            $ADB pull /sdcard/ui$TRY.xml /tmp/ui$TRY.xml > /dev/null 2>&1 || true
            if grep -q "$FRAG" /tmp/ui$TRY.xml 2>/dev/null; then
              echo "OK: текст найден в поле (попытка $TRY)"
              break
            fi
            echo "попытка $TRY: текста нет, перекидываю фокус и пробую снова"
            $ADB shell input tap 360 680
            sleep 2
            $ADB shell ime set com.android.adbkeyboard/.AdbIME
            sleep 2
          done
          $ADB exec-out screencap -p > screenshot_review_typed.png 2>/dev/null || true
          echo "screenshot: $(stat -c%s screenshot_review_typed.png 2>/dev/null || echo 0)"

      - name: Run automation script (диагностика)
        if: github.event.inputs.script != ''
        run: |
          mkdir -p probe
          chmod +x scripts/${{ github.event.inputs.script }} 2>/dev/null || true
          bash scripts/${{ github.event.inputs.script }} 2>&1 | tee probe/output.txt
          $ADB exec-out screencap -p > probe/screen_after_script.png 2>/dev/null || true

      - name: Upload probe artifacts (early)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: |
            probe/
            screenshot_review_typed.png
          if-no-files-found: ignore

      - name: Start ws-scrcpy (browser mirror)
        if: github.event.inputs.action == 'run'
        run: |
          git clone --depth 1 https://github.com/NetrisTV/ws-scrcpy.git /opt/wsscrcpy
          cd /opt/wsscrcpy
          npm install --no-audit --no-fund 2>&1 | tail -1
          npm run dist 2>&1 | tail -2
          export PATH=$SDK/platform-tools:$PATH
          $ADB start-server
          cd dist
          nohup node index.js > ws.log 2>&1 &
          OK=0
          for i in $(seq 1 45); do
            sleep 2
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 || true)
            if [ "$CODE" = "200" ]; then OK=1; echo "ws-scrcpy UP after $((i*2))s"; break; fi
          done
          if [ "$OK" != "1" ]; then
            echo "ws-scrcpy FAILED to start:"; tail -30 ws.log; exit 1
          fi

      - name: Cloudflare tunnel
        if: github.event.inputs.action == 'run'
        run: |
          curl -sL -o cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cf
          nohup ./cf tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &
          OK=0
          for i in $(seq 1 30); do
            sleep 2
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1)
            if [ -n "$URL" ]; then OK=1; break; fi
          done
          echo "TUNNEL_URL=$URL"
          echo "$URL" > tunnel_url_live.txt
          if [ "$OK" != "1" ]; then echo "tunnel failed:"; tail -20 cf.log; exit 1; fi
          echo "$URL" >> $GITHUB_STEP_SUMMARY
          RESP=$(curl -s "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" --data-urlencode "text=🎮 Android готов: $URL (открой в браузере, выбери emulator-5554)")
          echo "TG RESP: $RESP"

      - name: Upload URL artifact (live)
        if: ${{ always() && github.event.inputs.action == 'run' }}
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: tunnel_url_live.txt
          if-no-files-found: ignore

      - name: Keep session alive
        if: github.event.inputs.action == 'run'
        run: |
          MIN=${{ github.event.inputs.session_minutes }}
          if [ "$MIN" -gt 350 ]; then MIN=350; fi
          echo "Session will run ${MIN} minutes. Ctrl-C not possible; sleep with status checks."
          END=$((SECONDS + MIN*60))
          NEXT_SAVE=$((SECONDS + 600))
          while [ $SECONDS -lt $END ]; do
            sleep 60
            # каждые 15 мин: штатное выключение Android, tar покойного диска, подъем снова
            if [ "$SECONDS" -ge "$NEXT_SAVE" ] && [ ! -f /tmp/avd_saving.lock ]; then
              NEXT_SAVE=$((SECONDS + 900))
              touch /tmp/avd_saving.lock
              echo "=== штатный shutdown Android ==="
              sleep 15
              $ADB shell sync || true
              $ADB shell reboot -p || $ADB shell svc power shutdown || true
              for i in $(seq 1 30); do
                $ADB get-state >/dev/null 2>&1 || { echo "adb отвалился (Android погас)"; break; }
                sleep 1
              done
              sleep 10
              $ADB emu kill >/dev/null 2>&1 || true
              sleep 20
              TS="s$(date -u +%Y%m%d%H%M%S)"
              # чистка: снапшоты, hardware-qemu.ini, локи, кеш
              AVDD="$ANDROID_AVD_HOME/pixel6a.avd"
              rm -rf "$AVDD/snapshots" "$AVDD/hardware-qemu.ini" "$AVDD"/*.lock "$AVDD/cache.img"*
              # rebase qcow2 на относительные пути
              sudo apt-get install -y qemu-utils >/dev/null 2>&1 || true
              for q in "$AVDD"/*.qcow2; do
                [ -f "$q" ] || continue
                base="${q%.qcow2}"
                [ -f "$base" ] || continue
                FMT=$(qemu-img info "$base" 2>/dev/null | awk -F': ' '/file format:/{print $2}')
                [ -n "$FMT" ] && qemu-img rebase -u -F "$FMT" -b "$(basename "$base")" "$q" || true
              done
              cd "$ANDROID_AVD_HOME" && rm -f /tmp/avd.tar.gz /tmp/part_* /tmp/${TS}_part_* && tar czf /tmp/avd.tar.gz pixel6a.ini pixel6a.avd && cd -
              gzip -t /tmp/avd.tar.gz || { echo "tar битый, сейв пропущен"; rm -f /tmp/avd_saving.lock; }
              if [ -f /tmp/avd_saving.lock ]; then
                split -b 900m -d -a 2 /tmp/avd.tar.gz /tmp/${TS}_part_
                for TAG in avd-snap avd-backup; do
                  gh release create $TAG -R "$GITHUB_REPOSITORY" --title "AVD snapshot" --notes "autostate" 2>/dev/null || true
                  gh release upload $TAG /tmp/${TS}_part_* -R "$GITHUB_REPOSITORY" --clobber && echo "AVD $TS -> $TAG at ${SECONDS}s" || echo "upload to $TAG FAILED"
                  for ID in $(gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG --jq ".assets[] | select(.name | startswith(\"${TS}_\") | not) | .id" 2>/dev/null); do
                    gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/assets/$ID > /dev/null 2>&1 || true
                  done
                done
                rm -f /tmp/avd.tar.gz /tmp/${TS}_part_* /tmp/avd_saving.lock
              fi
              echo "=== поднимаем эмулятор снова ==="
              cd "$ANDROID_AVD_HOME/.."
              nohup $SDK/emulator/emulator -avd pixel6a \
                -no-window -no-boot-anim -no-metrics -no-audio \
                -gpu swiftshader_indirect -accel on -writable-system -no-snapshot \
                -memory 2048 -cores 2 \
                -camera-back emulated -camera-front emulated \
                > "${{ github.workspace }}/emulator.log" 2>&1 &
              cd -
              for i in $(seq 1 60); do
                sleep 5
                B=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
                [ "$B" = "1" ] && { echo "reboot OK at $((i*5))s"; break; }
              done
              $ADB shell input keyevent 82 || true
              $ADB shell wm dismiss-keyguard || true
            fi
            # health: туннель жив?
            if ! grep -q "trycloudflare" cf.log 2>/dev/null; then echo "tunnel log missing"; fi
            ALIVE=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "tick: boot=$ALIVE elapsed=$((SECONDS/60))m"
          done

      - name: Save AVD snapshot to Release
        if: github.event.inputs.action == 'snapshot'
        run: |
          # boot emulator briefly to write a clean snapshot of current AVD state
          nohup $SDK/emulator/emulator -avd pixel6a -no-window -no-boot-anim -no-metrics -no-audio -gpu swiftshader_indirect -accel on -writable-system -no-snapshot -feature -Vulkan -memory 2048 -cores 2 > "${{ github.workspace }}/snap_boot.log" 2>&1 &
          for i in $(seq 1 60); do
            sleep 5
            B=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && break
          done
          # штатное выключение Android вместо snapshot save + kill
          sleep 15
          $ADB shell sync || true
          $ADB shell reboot -p || $ADB shell svc power shutdown || true
          for i in $(seq 1 30); do
            $ADB get-state >/dev/null 2>&1 || { echo "adb отвалился (Android погас)"; break; }
            sleep 1
          done
          sleep 10
          $ADB emu kill >/dev/null 2>&1 || true
          sleep 20
          # упаковываем AVD: чистка + rebase + pixel6a layout
          AVDD="$ANDROID_AVD_HOME/pixel6a.avd"
          rm -rf "$AVDD/snapshots" "$AVDD/hardware-qemu.ini" "$AVDD"/*.lock "$AVDD/cache.img"*
          sudo apt-get install -y qemu-utils >/dev/null 2>&1 || true
          for q in "$AVDD"/*.qcow2; do
            [ -f "$q" ] || continue
            base="${q%.qcow2}"
            [ -f "$base" ] || continue
            FMT=$(qemu-img info "$base" 2>/dev/null | awk -F': ' '/file format:/{print $2}')
            [ -n "$FMT" ] && qemu-img rebase -u -F "$FMT" -b "$(basename "$base")" "$q" || true
          done
          cd "$ANDROID_AVD_HOME"
          rm -f /tmp/avd-snapshot.tar.gz /tmp/part_* /tmp/${TS}_part_* 2>/dev/null
          TS="s$(date -u +%Y%m%d%H%M%S)"
          tar czf /tmp/avd-snapshot.tar.gz pixel6a.ini pixel6a.avd
          ls -la /tmp/avd-snapshot.tar.gz
          split -b 900m -d -a 2 /tmp/avd-snapshot.tar.gz /tmp/${TS}_part_
          for TAG in avd-snap avd-backup; do
            gh release create $TAG -R "$GITHUB_REPOSITORY" --title "AVD snapshot" --notes "pixel6a AVD + snapshots (autostate)" 2>/dev/null || true
            gh release upload $TAG /tmp/${TS}_part_* -R "$GITHUB_REPOSITORY" --clobber || echo "upload to $TAG FAILED"
            for ID in $(gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG --jq ".assets[] | select(.name | startswith(\"${TS}_\") | not) | .id" 2>/dev/null); do
              gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/assets/$ID > /dev/null 2>&1 || true
            done
          done
          echo "uploaded"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-session
          path: |
            emulator.log
            snap_boot.log
            cf.log
            tunnel_url_live.txt
            /opt/wsscrcpy/dist/ws.log
          if-no-files-found: ignore
