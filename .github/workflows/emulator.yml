name: Android Emulator Session
on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Длительность сессии (минут)"
        default: "60"
      script:
        description: "Скрипт из scripts/ (пусто = просто держать)"
        default: ""
      geo:
        description: "Гео lat lon"
        default: "55.7539 37.6208"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-33
          key: sysimg-android-30-google_apis-x86_64-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/avd
          key: avd-light-v1

      - name: Create realistic AVD (Pixel 6a)
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # ставим образ, если нет предустановленного
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "emulator" "platform-tools" > /dev/null 2>&1 || true
          if [ ! -d $SDK/system-images/android-33/google_apis/x86_64 ]; then
            $SDK/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-30;google_apis;x86_64" > /dev/null 2>&1
          else
            echo "образ из кеша — пропускаю установку"
          fi
          if [ ! -d $ANDROID_AVD_HOME/pixel6a.avd ]; then
            echo "no" | $SDK/cmdline-tools/latest/bin/avdmanager create avd \
              -n pixel6a -k "system-images;android-30;google_apis;x86_64" -d pixel_6a --force
            CFG=$(find $ANDROID_AVD_HOME -name config.ini -path "*pixel6a*" | head -1)
            for kv in "hw.lcd.density=420" "hw.lcd.width=1080" "hw.lcd.height=2400" \
                      "hw.gps=yes" "hw.sensors.proximity=yes" "hw.sensors.light=yes" \
                      "hw.battery=yes" "hw.battery.status=discharging" "hw.battery.level=87" \
                      "hw.camera.back=virtualscene" "hw.wifi=yes" "hw.ramSize=6144" \
                      "hw.cpu.arch=x86_64" "fastboot.forceColdBoot=no"; do
              echo "$kv" | tr '=' ' ' | xargs -I{} true
              echo "$(echo $kv | cut -d= -f1) = $(echo $kv | cut -d= -f2)" >> $CFG
            done
            sed -i 's/^hw.device.name=.*/hw.device.name = pixel_6a/' $CFG
          else
            echo "AVD из кеша"
          fi


      - name: Boot emulator
        timeout-minutes: 15
        run: |
          SDK=/usr/local/lib/android/sdk
          ls -la $ANDROID_AVD_HOME
          cat $ANDROID_AVD_HOME/pixel6a.ini 2>/dev/null || true
          sed -i "s|^path=.*|path=$ANDROID_AVD_HOME/pixel6a.avd|" $ANDROID_AVD_HOME/pixel6a.ini
          grep -E "hw.cpu.arch|abi.type" $ANDROID_AVD_HOME/pixel6a.avd/config.ini || echo "hw.cpu.arch = x86_64" >> $ANDROID_AVD_HOME/pixel6a.avd/config.ini
          nohup $SDK/emulator/emulator -avd pixel6a \
            -no-window -no-boot-anim -no-metrics -accel on \
            -gpu swiftshader_indirect -accel on -feature -Vulkan \
            -writable-system -memory 6144 -cores 2 \
            -qemu -enable-kvm > emulator.log 2>&1 &
          ADB=$SDK/platform-tools/adb
          $ADB wait-for-device
          for a in $(seq 1 60); do
            B="$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$B" = "1" ] && break
            sleep 5
          done
          for a in 1 2 3 4 5; do
            $ADB root && break
            sleep 10
          done
          sleep 3 && $ADB remount || true
          # Маскировка признаков эмулятора
          $ADB shell settings put global adb_enabled 1
          $ADB shell settings put global window_animation_scale 1.0
          $ADB shell settings put global transition_animation_scale 1.0
          $ADB shell settings put global animator_duration_scale 1.0
          echo "booted"

      - name: Spoof device props (root)
        run: |
          SDK=/usr/local/lib/android/sdk
          ADB=$SDK/platform-tools/adb
          $ADB root || true
          sleep 3
          $ADB remount || true
          sleep 2
          cat > spoof.sh <<'SOF'
          for B in /system/build.prop /system/system/build.prop /system/etc/prop.default; do
            [ -f "$B" ] || continue
            mount -o remount,rw / 2>/dev/null
            mount -o remount,rw /system 2>/dev/null
            sed -i s/^ro.product.model=.*/ro.product.model=Pixel\ 6a/ "$B"
            sed -i s/^ro.product.brand=.*/ro.product.brand=google/ "$B"
            sed -i s/^ro.product.device=.*/ro.product.device=bluejay/ "$B"
            sed -i s/^ro.product.name=.*/ro.product.name=bluejay/ "$B"
            sed -i s/^ro.product.manufacturer=.*/ro.product.manufacturer=Google/ "$B"
            echo "patched $B"
          done
          echo done
          SOF
          $ADB push spoof.sh /data/local/tmp/spoof.sh
          $ADB shell su 0 sh /data/local/tmp/spoof.sh || true
          $ADB shell setprop persist.sys.timezone Europe/Moscow || true
          $ADB shell "settings put system time_12_24 24" || true

      - name: Set geo (Moscow)
        run: |
          SDK=/usr/local/lib/android/sdk
          ADB=$SDK/platform-tools/adb
          LAT=$(echo "${{ github.event.inputs.geo }}" | awk '{print $1}')
          LON=$(echo "${{ github.event.inputs.geo }}" | awk '{print $2}')
          $ADB emu geo fix $LON $LAT
          $ADB emu geo nmea \$GPGGA,120000.000,$LAT,N,${LON}0,E,1,08,0.9,156.0,M,18.0,M,,*47 || true
          # persist geo provider
          $ADB shell settings put secure location_providers_allowed +gps,+network
          sleep 2
          $ADB emu geo fix $LON $LAT

      - name: Install APKs (Yandex Maps из Release + любые из репо)
        run: |
          SDK=/usr/local/lib/android/sdk
          ADB=$SDK/platform-tools/adb
          # качаем APK из релиза репы (кеш-URL: всегда последний ассет)
          APK_URL=$(gh api repos/${{ github.repository }}/releases/tags/maps-apk -q '.assets[0].browser_download_url' 2>/dev/null || echo "")
          if [ -n "$APK_URL" ]; then
            echo "Downloading $APK_URL"
            curl -sL "$APK_URL" -o /tmp/yandexmaps.apk --max-time 280
            $ADB install -r /tmp/yandexmaps.apk || $ADB install -r -d -g /tmp/yandexmaps.apk
          else
            echo "Release maps-apk не найден"
          fi
          for apk in $(ls *.apk apks/*.apk 2>/dev/null); do
            echo "Installing $apk"
            $ADB install -r "$apk" || $ADB install -r -d -g "$apk"
          done
          # запускаем Яндекс Карты, если установлены
          PKG=$($ADB shell pm list packages | grep -o 'package:ru.yandex.yandexmaps' | cut -d: -f2 | tr -d '\r')
          if [ -n "$PKG" ]; then
            echo "Разрешения + запуск $PKG"
            $ADB shell pm grant $PKG android.permission.ACCESS_FINE_LOCATION 2>/dev/null || true
            $ADB shell pm grant $PKG android.permission.ACCESS_COARSE_LOCATION 2>/dev/null || true
            $ADB shell pm grant $PKG android.permission.ACCESS_BACKGROUND_LOCATION 2>/dev/null || true
            # запускаем logcat в фон — поймаем событие "Displayed" и краши
            $ADB logcat -c || true
            ($ADB logcat > logcat_dump.txt 2>&1 &) || true
            $ADB shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
            # === СОБЫТИЙНАЯ ЛОГИКА (без таймеров) ===
            # Ждём пока: 1) процесс жив 2) окно приложения в фокусе 3) Android отрисовал окно (Displayed в logcat)
            for i in $(seq 1 60); do
              ALIVE=$($ADB shell pidof $PKG 2>/dev/null | tr -d '\r')
              FOCUS=$($ADB shell dumpsys window 2>/dev/null | grep mCurrentFocus | tr -d '\r')
              if [ -n "$ALIVE" ] && echo "$FOCUS" | grep -q "$PKG"; then
                echo "[$i] process alive (pid $ALIVE), focus: $FOCUS"
                # окно в фокусе — ждём событие Displayed (не более 15 итераций)
                for j in $(seq 1 15); do
                  if grep -q "Displayed.*$PKG" logcat_dump.txt 2>/dev/null; then
                    echo "[$i/$j] Displayed event caught!"
                    break 2
                  fi
                  # процесс умер во время ожидания?
                  ALIVE2=$($ADB shell pidof $PKG 2>/dev/null | tr -d '\r')
                  [ -z "$ALIVE2" ] && { echo "[$i/$j] PROCESS DIED waiting for Displayed"; break 2; }
                  sleep 2
                done
                break
              fi
              echo "[$i] waiting: alive='$ALIVE' focus='$FOCUS'"
              sleep 2
            done
            # состояние на момент скрина
            echo "=== state at screenshot ==="
            $ADB shell dumpsys window | grep mCurrentFocus || true
            $ADB shell dumpsys activity activities | grep mResumedActivity || true
            echo "=== screen ==="
            $ADB exec-out screencap -p > screenshot_maps.png 2>/dev/null || true
            echo "maps screenshot: $(stat -c%s screenshot_maps.png 2>/dev/null || echo 0)"
            # ждём прогрузки карты: стимулируем тапами (сбрасывают idle), ждём сетевую активность приложения
            for t in $(seq 1 30); do
              sleep 4
              # лёгкий тап в центр карты каждые 20с — стимул перерисоваться/дотянуть тайлы
              if [ $((t % 5)) -eq 0 ]; then $ADB shell input tap 540 1200 2>/dev/null || true; fi
              # проверяем активную сеть от приложения
              NET=$($ADB shell dumpsys netstats detail 2>/dev/null | grep -A2 $PKG | head -2 || true)
              RX1=$($ADB shell cat /proc/net/dev 2>/dev/null | grep -m1 wlan0 | awk '{print $2}')
              sleep 2
              RX2=$($ADB shell cat /proc/net/dev 2>/dev/null | grep -m1 wlan0 | awk '{print $2}')
              if [ -n "$RX1" ] && [ -n "$RX2" ] && [ "$RX2" -le "$RX1" ]; then
                # сеть утихла — тайлы либо догрузились, либо не идут; ещё пара циклов и выходим
                if [ $((t % 5)) -eq 0 ]; then echo "network idle at $((t*4))s rx=$RX2"; break; fi
              fi
            done
            echo "tile wait done at ~$((t*4))s"
            $ADB exec-out screencap -p > screenshot_maps2.png 2>/dev/null || true
            echo "maps screenshot2 (map loaded): $(stat -c%s screenshot_maps2.png 2>/dev/null || echo 0)"
            # === ШАГ: тап по кнопке меню (☰) в левом верхнем углу ===
            $ADB shell input tap 60 95 || true
            sleep 4
            # ждём открытия нового окна (фокус сменился)
            for i in $(seq 1 15); do
              FOCUS2=$($ADB shell dumpsys window 2>/dev/null | grep mCurrentFocus | tr -d '\r')
              echo "after menu tap focus: $FOCUS2"
              # скриним когда фокус не SplashScreen и не карта (открылось меню/окно)
              if ! echo "$FOCUS2" | grep -q "SplashScreen"; then break; fi
              sleep 2
            done
            $ADB exec-out screencap -p > screenshot_step_menu.png 2>/dev/null || true
            echo "menu screenshot: $(stat -c%s screenshot_step_menu.png 2>/dev/null || echo 0)"
            # сохраняем снапшот — следующий запуск поднимется из этого состояния за ~20с
            $ADB emu snapshot save maps_ready 2>/dev/null || true
            echo "snapshot saved"
          fi

      - name: Run automation script
        if: ${{ github.event.inputs.script != '' }}
        run: |
          chmod +x scripts/${{ github.event.inputs.script }} || true
          scripts/${{ github.event.inputs.script }}

      - name: Session loop
        run: |
          SDK=/usr/local/lib/android/sdk
          ADB=$SDK/platform-tools/adb
          MIN=${{ github.event.inputs.session_minutes }}
          # минимум 2 минуты: все шаги до скринов занимают ~1 мин, остальное ждёт loops
          if [ "$MIN" -lt 2 ]; then MIN=2; fi
          END=$((SECONDS + MIN*60))
          # разбудить экран, снять keyguard
          $ADB shell input keyevent KEYCODE_WAKEUP
          sleep 2
          $ADB shell wm dismiss-keyguard || true
          sleep 3
          # запустить Карты и пройти онбординг
          PKG=ru.yandex.yandexmaps
          if $ADB shell pm list packages | grep -q "$PKG"; then
            $ADB shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
            # скрин КАК МОЖНО РАНЬШЕ, до краша гостя
            for a in 1 2 3 4 5 6; do
              sleep 5
              $ADB exec-out screencap -p > shot_tmp.png 2>/dev/null || break
              SZ=$(stat -c%s shot_tmp.png 2>/dev/null || echo 0)
              if [ "$SZ" -gt 50000 ]; then cp shot_tmp.png screenshot_maps.png; break; fi
            done
            # онбординг-тапы если ещё жив
            for i in 1 2 3; do
              $ADB shell input tap 720 2670 || true
              sleep 2
              $ADB shell input tap 720 2980 || true
              sleep 2
              $ADB exec-out screencap -p > shot_tmp.png 2>/dev/null || break
              SZ=$(stat -c%s shot_tmp.png 2>/dev/null || echo 0)
              if [ "$SZ" -gt 50000 ]; then cp shot_tmp.png screenshot_maps.png; fi
            done
          fi
          for a in 1 2 3; do
            $ADB exec-out screencap -p > screenshot_boot.png 2>/dev/null && break
            sleep 5
          done
          ls -la screenshot*.png || true
          echo "screenshot taken: $(date)"
          $ADB shell getprop > props_dump.txt || true
          while [ $SECONDS -lt $END ]; do
            sleep 300
            $ADB emu geo fix 37.6208 55.7539 || true
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-session
          path: |
            screenshot_maps*.png
            screenshot_step_*.png
            screenshot_boot.png
            props_dump.txt
            logcat_dump.txt
            emulator.log
          if-no-files-found: warn
