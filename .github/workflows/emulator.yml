name: Android Emulator Session
on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Длительность сессии (минут)"
        default: "60"
      script:
        description: "Скрипт из scripts/ (пусто = просто держать)"
        default: ""
      geo:
        description: "Гео lat lon"
        default: "55.7539 37.6208"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Create realistic AVD (Pixel 7 Pro)
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # ставим образ, если нет предустановленного
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-33;google_apis;x86_64" > /dev/null 2>&1 || true
          ls $SDK/system-images/android-33/google_apis/x86_64/ > /dev/null 2>&1 || \
            $SDK/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-33;google_apis;x86_64"
          echo "no" | $SDK/cmdline-tools/latest/bin/avdmanager create avd \
            -n pixel7pro -k "system-images;android-33;google_apis;x86_64" -d pixel_7 --force
          export ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-$HOME/.android/avd}
          mkdir -p $ANDROID_AVD_HOME
          CFG=$(find $HOME -name config.ini -path "*pixel7pro*" 2>/dev/null | head -1)
          echo "AVD config: $CFG"
          [ -f "$CFG" ] || { find $HOME -maxdepth 4 -name "*.avd" -type d 2>/dev/null; ls -la $HOME/.android 2>/dev/null || true; exit 1; }
          cat >> $CFG <<'EOF'
          hw.lcd.density = 560
          hw.lcd.width = 1440
          hw.lcd.height = 3120
          hw.lcd.backlight = true
          hw.mainKeys = false
          hw.trackBall = false
          hw.dPad = no
          hw.gps = yes
          hw.sensors.orientation = yes
          hw.sensors.proximity = yes
          hw.sensors.light = yes
          hw.sensors.magnetic_field = yes
          hw.sensors.pressure = yes
          hw.sensors.humidity = yes
          hw.sensors.temperature = yes
          hw.battery = yes
          hw.battery.status = discharging
          hw.battery.level = 87
          hw.audioInput = yes
          hw.camera.back = virtualscene
          hw.camera.front = emulated
          hw.wifi = yes
          hw.network.speed = full
          hw.ramSize = 6144
          disk.dataPartition.size = 32G
          image.sysdir.1 = system-images/android-33/google_apis/x86_64/
          tag.id = google_apis
          hw.device.name = pixel_7_pro
          hw.device.model = Pixel 7 Pro
          avd.ini.displayname = Pixel 7 Pro
          fastboot.forceColdBoot = no
          EOF
          sed -i 's/^image.sysdir.1 = .*//' $CFG
          echo 'image.sysdir.1 = system-images/android-33/google_apis/x86_64/' >> $CFG
          sed -i 's/^hw.device.name=.*/hw.device.name = pixel_7_pro/' $CFG
          sed -i 's/^tag.id=.*/tag.id = google_apis/' $CFG

      - name: Boot emulator
        timeout-minutes: 15
        run: |
          SDK=/usr/local/lib/android/sdk
          AVD_DIR=$(dirname $(find $HOME -name config.ini -path "*pixel7pro*" 2>/dev/null | head -1))
          echo "AVD_DIR=$AVD_DIR"
          INI_SRC=$(find $HOME -name pixel7pro.ini 2>/dev/null | grep -v ".avd" | head -1)
          mkdir -p $HOME/.android/avd
          [ -n "$INI_SRC" ] && cp "$INI_SRC" $HOME/.android/avd/pixel7pro.ini
          [ -f $HOME/.android/avd/pixel7pro.ini ] || echo "path=$AVD_DIR/pixel7pro.avd" > $HOME/.android/avd/pixel7pro.ini
          sed -i "s|^path=.*|path=$AVD_DIR/pixel7pro.avd|" $HOME/.android/avd/pixel7pro.ini
          nohup $SDK/emulator/emulator -avd pixel7pro \
            -no-window -no-snapshot -no-boot-anim -no-metrics \
            -gpu swiftshader_indirect -accel on \
            -writable-system -memory 4096 -cores 3 \
            -qemu -enable-kvm > emulator.log 2>&1 &
          ADB=$SDK/platform-tools/adb
          $ADB wait-for-device
          until [ "$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 5; done
          $ADB root && sleep 3 && $ADB remount || true
          # Маскировка признаков эмулятора
          $ADB shell settings put global adb_enabled 1
          $ADB shell settings put global window_animation_scale 1.0
          $ADB shell settings put global transition_animation_scale 1.0
          $ADB shell settings put global animator_duration_scale 1.0
          echo "booted"

      - name: Spoof device props (root)
        run: |
          SDK=/usr/local/lib/android/sdk
          ADB=$SDK/platform-tools/adb
          $ADB root; sleep 2
          # build.prop: реальный Pixel 7 Pro (Cheetah)
          $ADB shell "su 0 sh -c '
            mount -o remount,rw /system 2>/dev/null
            B=/system/build.prop
            sed -i s/^ro.product.model=.*/ro.product.model=Pixel\ 7\ Pro/ $B
            sed -i s/^ro.product.brand=.*/ro.product.brand=google/ $B
            sed -i s/^ro.product.device=.*/ro.product.device=cheetah/ $B
            sed -i s/^ro.product.name=.*/ro.product.name=cheetah/ $B
            sed -i s/^ro.product.manufacturer=.*/ro.product.manufacturer=Google/ $B
            grep -q ro.product.model= $B || echo ro.product.model=Pixel\ 7\ Pro >> $B
          '" 2>/dev/null || echo "remount not possible, skipping build.prop (props via setprop)"
          $ADB shell setprop ro.product.model "Pixel 7 Pro" 2>/dev/null || true
          $ADB shell setprop ro.kernel.qemu 0 2>/dev/null || true

      - name: Set geo (Moscow)
        run: |
          SDK=/usr/local/lib/android/sdk
          ADB=$SDK/platform-tools/adb
          LAT=$(echo "${{ github.event.inputs.geo }}" | awk '{print $1}')
          LON=$(echo "${{ github.event.inputs.geo }}" | awk '{print $2}')
          $ADB emu geo fix $LON $LAT
          $ADB emu geo nmea \$GPGGA,120000.000,$LAT,N,${LON}0,E,1,08,0.9,156.0,M,18.0,M,,*47 || true
          # persist geo provider
          $ADB shell settings put secure location_providers_allowed +gps,+network
          sleep 2
          $ADB emu geo fix $LON $LAT

      - name: Install APK (если есть)
        run: |
          SDK=/usr/local/lib/android/sdk
          for apk in $(ls *.apk 2>/dev/null); do
            $SDK/platform-tools/adb install -r "$apk"
          done

      - name: Run automation script
        if: ${{ github.event.inputs.script != '' }}
        run: |
          chmod +x scripts/${{ github.event.inputs.script }} || true
          scripts/${{ github.event.inputs.script }}

      - name: Session loop
        run: |
          SDK=/usr/local/lib/android/sdk
          ADB=$SDK/platform-tools/adb
          MIN=${{ github.event.inputs.session_minutes }}
          END=$((SECONDS + MIN*60))
          $ADB exec-out screencap -p > screenshot_boot.png
          $ADB shell getprop > props_dump.txt || true
          while [ $SECONDS -lt $END ]; do
            sleep 300
            $ADB emu geo fix 37.6208 55.7539 || true
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-session
          path: |
            screenshot_boot.png
            props_dump.txt
            emulator.log
          if-no-files-found: warn
